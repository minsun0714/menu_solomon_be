app:
  frontend-base-url: "${FRONTEND_ORIGIN}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS}"

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

kakao:
  rest-api-key: "${KAKAO_REST_API_KEY}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
